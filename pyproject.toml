[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Multi-agent retrieval and knowledge platform with hybrid search, grounded responses, evaluation and observability."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "harsham032" }]
keywords = ["retrieval", "hybrid-search", "information-retrieval", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "rank-bm25>=0.2.2",
    "lxml>=5.1",
    "beautifulsoup4>=4.12",
    "pypdf>=4.1",
    "SQLAlchemy>=2.0",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
qdrant = ["qdrant-client>=1.8"]
cache = ["redis>=5.0"]
transformers = ["sentence-transformers>=2.6", "torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
rag-index = "rag_platform.cli:build_index_command"
rag-query = "rag_platform.cli:query_command"
rag-evaluate = "rag_platform.cli:evaluate_command"

[project.urls]
Repository = "https://github.com/Harsham032/enterprise-agentic-rag-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_platform = ["py.typed", "data/sql/*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["T201"]
# The lifespan signature is fixed by the framework; the `C` parameter mirrors
# scikit-learn's own name for the inverse regularisation strength.
"src/rag_platform/services/api.py" = ["ARG001"]
"src/rag_platform/models/reranker.py" = ["N803", "ARG002"]

[tool.mypy]
python_version = "3.11"
packages = ["rag_platform"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require outbound network access (deselected by default)",
    "slow: tests that take more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:rag_platform.*"]

[tool.coverage.run]
source = ["src/rag_platform"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
