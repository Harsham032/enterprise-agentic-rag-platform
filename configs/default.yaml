# Default pipeline configuration. Every value can be overridden on the command
# line (--set key=value) or through RAG_* environment variables.

run:
  name: default
  seed: 20260101
  output_dir: reports

corpus:
  # Directory scanned by the ingestion pipeline. The bundled evaluation corpus
  # ships with the repository; live SEC/PubMed acquisitions land in data/raw.
  source_dir: data/fixtures/corpus
  qrels_path: data/fixtures/qrels.json

chunking:
  # Selected on the training query split at a fixed 400-token evidence budget.
  # See docs/results.md for the sweep this was chosen from.
  strategy: section_aware      # fixed_window | section_aware
  target_tokens: 300
  overlap_tokens: 40
  min_tokens: 40

embedding:
  backend: tfidf_svd           # tfidf_svd | sentence_transformers | openai
  dim: 256
  min_df: 1
  max_df: 0.85
  ngram_max: 2

retrieval:
  top_k: 10
  candidate_k: 50
  fusion: weighted             # weighted | rrf
  lexical_weight: 0.45
  dense_weight: 0.55
  rrf_k: 60

reranking:
  enabled: true
  model: logistic              # logistic | none
  candidate_k: 30
  top_k: 10

planning:
  enabled: true
  max_subqueries: 3

generation:
  backend: extractive          # extractive | anthropic | openai
  max_spans: 4
  span_sentences: 2
  min_support_overlap: 0.35

evaluation:
  k_values: [1, 3, 5, 10]
  primary_k: 5
  token_budget: 400
  max_budget_k: 25
  latency_warmup: 2
