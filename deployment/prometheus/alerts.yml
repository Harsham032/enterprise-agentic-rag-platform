# Alerting rules matching the thresholds in docs/architecture.md.

groups:
  - name: rag-platform
    rules:
      - alert: RetrievalGroundednessDegraded
        expr: |
          (sum(rate(rag_answer_groundedness_sum[10m]))
           / clamp_min(sum(rate(rag_answer_groundedness_count[10m])), 1)) < 0.80
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Answer groundedness has fallen below 0.80
          description: >-
            Usually means retrieval is returning off-topic evidence rather than
            that generation has regressed. Check the diagnostics block on a
            sample query response before redeploying.

      - alert: QueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(rag_query_latency_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 95th percentile query latency above 1.5 seconds

      - alert: ServiceIndexUnavailable
        expr: up{job="rag-platform"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The retrieval service is not responding to scrapes
