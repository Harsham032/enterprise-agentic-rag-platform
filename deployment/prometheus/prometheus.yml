# Scrape configuration for the retrieval service.
#
# The service exposes three families that matter operationally:
#   rag_queries_total          - request volume, labelled by planning strategy
#   rag_query_latency_seconds  - end-to-end latency histogram
#   rag_answer_groundedness    - answer quality, the signal that catches a
#                                retrieval regression before users report it

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
