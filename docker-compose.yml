# Local stack: the API plus the services it can optionally use.
#
# The API runs with the bundled evaluation corpus and the in-process vector
# backend by default, so `docker compose up api` is enough to try it. Postgres,
# Qdrant and Redis are wired up for the configurations that need them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      # Local development only. The deployed stack takes this from a secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_dev}
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/rag_platform/data/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["vectors"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    profiles: ["cache"]

  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      RAG_ENV: production
      RAG_LOG_LEVEL: INFO
      RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:-rag_local_dev}@postgres:5432/rag_platform
      RAG_VECTOR_BACKEND: numpy
      RAG_EMBEDDING_BACKEND: tfidf_svd
      RAG_GENERATION_BACKEND: extractive
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    profiles: ["observability"]

volumes:
  postgres_data:
  qdrant_data:
